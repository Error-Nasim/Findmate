name: Test Suite & Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  test-frontend:
    name: Frontend & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path:  'package-lock.json'

      - name: Install Dependencies
        run: |
          npm ci
          cd FindMate_Frontend && npm ci && cd ..

      - name: Run Test Suite with Coverage
        run: |
          node --experimental-test-coverage --test tests/**/*.test.mjs | tee tests/evidence/coverage_summary.txt

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage-report
          path: tests/evidence/coverage_summary.txt

  test-backend:
    name: Go Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22+
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Unit Tests
        run: |
          cd FindMate_Backend
          go test -v ./...
